# XARB bot server on Fly.io — see server/README.md.
app = "xarb-bot"
primary_region = "fra" # outside the US: Binance, Bybit and OKX refuse US addresses

[env]
  PORT = "8080"
  DB_PATH = "/data/xarb.db"
  TZ = "Europe/Sofia" # timestamps in /history

# Settings, alert history and cooldowns live here and survive deploys.
[mounts]
  source = "xarb_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: it is the thing watching prices. Exactly one machine — Telegram
  # allows a single poller per bot, and the SQLite file is on one volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb" # ~260 MB in use with Hydration pairs loaded
  cpu_kind = "shared"
  cpus = 1
